---
metadata:
  title: |
    Report changes to Social Security
  short title: |
    SSA Report Changes
  description: |
    Prepare a Statement of Claimant or Other Person (SSA-795) to report a change to Social Security. People who receive SSI, SSDI, or both can use this interview. If you get SSI, report changes promptly and no later than the tenth day of the month after they happen. If you get SSDI, tell Social Security right away about changes in your work or income or a big improvement in your medical condition.
  can_I_use_this_form: |
    Use this interview to prepare your own statement. You can describe changes in work, income, health, resources or living arrangements.
  before_you_start: |
    Have your address, the dates of your changes and any pay stubs handy. You can add your Social Security number to the completed statement after printing it.
  maturity: production
  estimated_completion_minutes: 15
  estimated_completion_delta: 15
  languages:
    - en
  jurisdiction: NAM-US
  help_page_url: https://www.ssa.gov/ssi/reporting/changes
  help_page_title: Report changes to your situation
  LIST_topics:
    - BE-01-03-00-00
  tags:
    - BE-01-03-00-00
  authors:
    - name: Quinten Steenhuis
      organization: Volunteer Lawyers Project of the Boston Bar Association
  revision_date: 2026-11-19
  update_notes: |
    Updated reporting guidance, preview, filing instructions and continuation pages.
---
features:
  javascript: 
    - phone.js 
  question back button: True    
---
objects:
  - client: Individual
  - ssa_office: Person
  - jobs: JobList.using(complete_attribute='employer_type') # Job
  - change_details: DADict.using(auto_gather=False, object_type=DAObject, gathered=True)
---
id: order
mandatory: True
code: |
  letter_date
  intro_screen
  client.name.first
  client.phone_number
  
  benefits_type
  set_changes
  if working or working_for_self:
    jobs.gather()
  
  # changes
  other_changes
  
  if not working and not working_for_self and (changes.true_values().number() < 1) and not other_changes:
    wrong_interview
  else:
    if benefits_type == 'ssi':
      #if changes.true_values().number() > 0:
      if changes['I moved']:   
        yes_moved
      if changes['I was in jail or prison']: 
        yes_jail
        jail_range
      if changes['I was in the hospital']:  
        yes_hospital
        hospital_range
      if changes['I was in a nursing home']: 
        yes_nursing
        nursing_range
      if changes['I was outside of the United States for more than 30 days in a row']: 
        yes_expat
        expat_range
      if changes['I received assistance to pay for rent or food']:
        change_details['I received assistance to pay for rent or food'].date
      if changes['I received money from a lawsuit or lottery winnings']: 
        change_details['I received money from a lawsuit or lottery winnings'].date 
      if not set(changes.true_values()).isdisjoint({
        'I got divorced',
        'I got married',
        'I started living by myself',
        'I started living with someone else',
        }):
          for change in set(changes.true_values()).intersection({
        'I got divorced',
        'I got married',
        'I started living by myself',
        'I started living with someone else',
        }):
            change_details[change].date
      if changes['My immigration status changed']: 
        change_details['My immigration status changed'].date 
        
  changes_details
  ssa_office.address.address
  statement_text
  preview_your_form
  client.signature
  store_variables_snapshot(data={'zip':client.address.zip,
    'state':client.address.state,
    'change_type':change_type,
    'changes': changes.true_values(),
    'benefits_type':benefits_type,
    'date':today(),
    'ssa_office': str(ssa_office.address.on_one_line()),
    })
  download_form
---
code: |
  if benefits_type == 'ssdi':
    changes = DAEmpty()
  set_changes = True
---
code: |
  letter_date = today()
---
code: |
  if working or working_for_self:
    employer_jobs = [job for job in jobs if job.employer_type == 'employer']
    self_jobs = [job for job in jobs if job.employer_type == 'self']
  else:
    employer_jobs = []
    self_jobs = []
---
interview help:
  heading: About this interview
  content: |
    This free interview was created by the Volunteer Lawyer's Project of the
    Boston Bar Foundation, a non-profit legal aid agency in Boston, Massachusetts.
  
    You can use this interview without an account. Sign in if you want to save your progress.
---
code: |
  jobs[i].is_hourly
  jobs[i].complete = True
---
id: intro screen
field: intro_screen
question: |
  We're here to help.
subquestion: |
  Prepare a statement to report a change to Social Security. When you finish, you will download your statement and send it to Social Security yourself.

  If you get SSI, report changes promptly and no later than the tenth day of the month after they happen. If you get SSDI, tell Social Security right away about changes in your work or income or a big improvement in your medical condition. See Social Security’s [SSI reporting guide](https://www.ssa.gov/ssi/text-report-ussi.htm) and [disability reporting guide](https://www.ssa.gov/disability/reporting).

  You will need your benefit type (SSI, SSDI, or both), address and dates of the changes. If you started working, have the employer’s name, hours and pay ready. Add your Social Security number after you print the statement.
fields: 
  - To continue you must accept the [terms of use](https://vlpnet.org/tos-for-guided-interviews/): intro_screen
    datatype: checkboxes
    minlength: 1
    validation messages:
      minlength: |
        You must accept the terms of use to continue.
    choices:
      - I accept the terms of use: i_accept
  
under: |
  _This website is not giving you legal advice. If you need legal advice, consult a lawyer._  
---
id: change screener
question: |
  Do you need to report a change to Social Security?
subquestion: |
  This interview is for people who need to report new information to
  Social Security. Does that apply to you?
field: needs_to_report_change
buttons:
  - Yes: yes
  - No: no
  - I'm not sure: unsure
---
id: wrong interview
event: wrong_interview
question: |
  It doesn't look like you need this interview.
subquestion: |
  This interview is only for someone who needs to report a change to the
  Social Security office. You said you didn't have any changes to report.
buttons:
  Exit: exit
  Restart: restart  
---
id: client name
question: |
  What is your name?
fields:
  - First name: client.name.first
  - Middle name: client.name.middle
    required: False
  - Last name: client.name.last
---
id: which office
question: |
  What Social Security office do you want to send the letter to?
subquestion: |
  Find the [mailing address for your Social Security office](https://www.ssa.gov/locator/).
  Enter it here to include it in your mailing instructions.
fields:
  - Address: ssa_office.address.address
  - Suite: ssa_office.address.unit
    required: False
  - City: ssa_office.address.city
  - State: ssa_office.address.state
    code: |
      states_list()
  - Zip: ssa_office.address.zip
---
features:
  question help button: False
  
---
id: benefits type
question: |
  What kind of Social Security benefits are you receiving?
help: | 
  If you are unsure whether you receive SSI, SSDI, or both you can call Social Security at 1-800-772-1213 or check the [Social Security website](https://www.ssa.gov/myaccount/)
fields: 
  - no label: benefits_type_checkboxes
    datatype: checkboxes
    choices:
      - SSI (Supplemental Security Income): ssi
      - SSDI (Social Security Disability): ssdi
    minlength: 1      
---
code: |
  # only special options come about if they receive SSI
  if benefits_type_checkboxes['ssi']:
    benefits_type = 'ssi'
  else:
    benefits_type = 'ssdi'
---
id: change type
question: |
  What kind of change do you have to report?
subquestion: |
  Select anything that has changed.
  Include paid work, such as driving for Uber or Lyft or doing odd jobs. Choose "Something else" to report stopping work, changes in pay or hours, or another change. Include the date and what changed. If you get SSDI, you can also use "Something else" to describe an improvement in your medical condition.
fields:
  - I started working for an employer: working
    datatype: yesnowide
  - I started working for myself: working_for_self
    datatype: yesnowide
  - no label: changes
    show if: 
      code: | 
        benefits_type =='ssi'
    datatype: checkboxes
    choices:
      - I moved
      - I was in jail or prison
      - I have an outstanding warrant for escape from custody, flight to avoid prosecution or confinement, or flight-escape: I received an arrest warrant
      - I was in the hospital
      - I was in a nursing home
      - I was outside the United States: I was outside of the United States for more than 30 days in a row
      - I had a change in resources 
      - My bank account or account balance changed
      - I received assistance to pay for rent or food
      - I received money from a lawsuit or lottery winnings
      - My immigration status changed
      - I got divorced
      - I got married
      - There was a death in the household
      - I was in school and I am under age 22
      - I have a medical condition that improved 
      - I had a change in my Ticket To Work status
      - I had a change in my work or my PASS expenses 

    none of the above: False
  - Something else: has_something_else
    datatype: yesnowide
  - What else would you like to report?: other_changes
    datatype: area
    show if: has_something_else
validation code: |
  if not has_something_else:
    other_changes = ''
---
code: |
  jobs.there_are_any = working or working_for_self
---
id: job is there another
question: |
  So far you have told us about ${ len(jobs.complete_elements()) } jobs.
subquestion: |
  Do you have any other jobs to report?
fields:
  - no label: jobs.there_is_another
    datatype: yesnoradio
---
id: job details
question: | 
  Tell me about the ${ ordinal(i) } job you need to report.
subquestion: |
  Look at your most recent pay stubs to answer this question.
fields:
  - When did you start this job?: jobs[i].start_date
    datatype: date
  - Do you work for yourself at this job, or someone else?: jobs[i].employer_type
    input type: radio
    choices:
      - Myself: self
      - Someone else: employer
  - Employer's name: jobs[i].employer
    show if: 
      variable: jobs[i].employer_type
      is: "employer"
  - What kind of work do you do for yourself?: jobs[i].self_employment_type  
    hide if: 
      variable: jobs[i].employer_type
      is: "employer"
  - Address of employer: jobs[i].employer_address
    required: False
    address autocomplete: True
    show if: 
      variable: jobs[i].employer_type
      is: "employer"
  - Is this an hourly job?: jobs[i].is_hourly
    datatype: yesno
  - Hourly rate: jobs[i].hourly_rate
    datatype: currency
    show if: jobs[i].is_hourly
    hint: $/hour
  - How often do you get paid?: jobs[i].period
    datatype: integer
    code: |
      period_list()
  - I work this many hours every pay check: jobs[i].hours_per_period
    datatype: integer
  - Total (gross) pay each pay period: jobs[i].value
    datatype: currency
    hide if: jobs[i].is_hourly
  - How much do you spend on deductible business expenses each month?: jobs[i].deductions
    datatype: currency
    show if:
      variable: jobs[i].employer_type
      is: "self"
  - I have pay stubs for this job.: jobs[i].have_pay_stubs
    datatype: yesno

---
