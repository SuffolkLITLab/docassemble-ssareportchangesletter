---
id: moved date 
continue button field: yes_moved
question: | 
  What was the date that you moved? 
fields:
  - Date: change_details['I moved'].date
    datatype: date
---
id: jail date 
continue button field: yes_jail
question: | 
  What was the date that you were in jail or prison? 
fields:
  - Date entered : jail_start
    datatype: date
  - Date left jail : jail_end 
    datatype: date
validation code: |
  if jail_end < jail_start:
    validation_error("The end date must be on or after the start date.", field="jail_end")
---
id: other change
question: |
  When did this change happen?
subquestion: |
  ${ 'An outstanding warrant for escape or flight' if i == 'I received an arrest warrant' else i }
fields:  
  - Date: change_details[i].date
    datatype: date
---
code: |
  jail_range = True
  change_details['I was in jail or prison'].date = jail_start + ' ' + 'to' + ' ' + jail_end
---
id: hospital 
continue button field: yes_hospital
question: | 
  What was the date that you were in the hospital? 
fields:
  - Date entered : hospital_start
    datatype: date
  - Date left hospital : hospital_end 
    datatype: date
validation code: |
  if hospital_end < hospital_start:
    validation_error("The end date must be on or after the start date.", field="hospital_end")
---
code: |
  hospital_range = True
  change_details['I was in the hospital'].date = hospital_start + ' ' + 'to' + ' ' + hospital_end
---
id: nursing home 
continue button field: yes_nursing 
question: | 
  When were you in the nursing home?
fields:
  - Date entered : nursing_start
    datatype: date
  - Date left nursing home : nursing_end 
    datatype: date
validation code: |
  if nursing_end < nursing_start:
    validation_error("The end date must be on or after the start date.", field="nursing_end")
---
code: |
  nursing_range = True
  change_details['I was in a nursing home'].date = nursing_start + ' ' + 'to' + ' ' + nursing_end
---
id: outside US
continue button field: yes_expat
question: | 
  When were you outside of the United States?
subquestion: |
  Social Security asks SSI recipients to report being outside the United States for a full calendar month or at least 30 days in a row.
fields:
  - Date you left the United States: expat_start
    datatype: date
  - Date you returned to the United States: expat_end
    datatype: date
validation code: |
  if expat_end < expat_start:
    validation_error("The end date must be on or after the start date.", field="expat_end")
---
code: |
  expat_range = True
  change_details['I was outside of the United States for more than 30 days in a row'].date = expat_start + ' ' + 'to' + ' ' + expat_end

---
id: recieved assistance
question: | 
  When did you receive assistance to pay for rent or food?
fields:
  - Date: change_details['I received assistance to pay for rent or food'].date 
    datatype: date
---
id: lawsuit or lottery
question: | 
  When did you receive money from a lawsuit or lottery winnings?
fields:
  - Date: change_details['I received money from a lawsuit or lottery winnings'].date 
    datatype: date
---
id: immigration status
question: | 
  When did your immigration status change?
fields:
  - Date: change_details['My immigration status changed'].date 
    datatype: date
---
id: other changes
question: |
  Is there anything else that you would like to report to Social Security?
fields:
  - no label: other_changes
    datatype: area
    required: False
---
id: contact info
generic object: Person
question: |
  Where do you live?
fields:
  - Home or cell phone number: client.phone_number
    datatype: tel  
    required: False
  - Work phone number: client.phone_work
    datatype: tel  
    required: False
  - Address: client.address.address
    address autocomplete: True
  - Unit or Apt: client.address.unit
    required: False
  - City: client.address.city
  - State: client.address.state
    code: |
      states_list()
  - Zip code: client.address.zip
    required: False
  #- County: x.address.county
  #  required: False
---
code: |
  changes_temp = []
  if working or working_for_self or (benefits_type == 'ssi' and changes['I received assistance to pay for rent or food']):
    changes_temp.append('income')
  if benefits_type == 'ssi':
    if not set(changes.true_values()).isdisjoint({
      'I moved', 
      'I was in jail or prison',
      'I was in the hospital',
      'I was in a nursing home',
      'I was outside of the United States for more than 30 days in a row',
      'The number of people in my household changed',
      'My immigration status changed',
      'I got divorced',
      'I got married',
      'I started living by myself',
      'I started living with someone else',
      }):
      changes_temp.append('living situation')
    if changes['I received money from a lawsuit or lottery winnings']:
      changes_temp.append('assets')
  change_type = comma_and_list(changes_temp)
---
id: details
question: |
  Add any more details
subquestion: |
  You mentioned the following changes: 
  
  % for change in changes.true_values():
  * ${'I was outside the United States' if change == 'I was outside of the United States for more than 30 days in a row' else change}
  % endfor
  ${showifdef('other_changes')} 
  
  If you want to add any more information about any of those changes, you can do so below.  
fields:
  - no label: changes_details
    datatype: area
    required: false
---
id: changes details
continue button field: saw_change_choices
question: |
  When did the changes take place?
fields: 
  code: change_choices
---
id: preview
question: |
  Preview your letter below
subquestion: |
  Click to open the PDF below in a new window. If you notice
  any mistakes, click the "back" button to go back and correct them.
  
  When you are ready, click "continue" to sign your letter and download
  a final copy.
  
  [Open your unsigned preview (PDF)](${ ssa_statement.as_pdf(key='preview').url_for() })

  Remember to come back to this window to continue and sign your form.

  When you sign this form you are saying the following:

  “I declare under penalty of perjury that I have examined all the information on this form, and on     any accompanying statements or forms, and it is true and correct to the best of my knowledge. I       understand that anyone who knowingly gives a false statement about a material fact in this            information, or causes someone else to do so, commits a crime and may be subject to a fine or         imprisonment.”
continue button field: preview_your_form  
---
id: signature
question: |
  Sign your letter
subquestion: |
  If you plan to mail or hand-deliver a paper copy, leave the signature blank and choose Continue. Sign page 2 in ink after printing.
signature: client.signature
under: |
  ${client}
required: False
---
id: download form
event: download_form
question: |
  Your statement is ready
subquestion: |
  1. Print the statement and add your Social Security number. For paper delivery, sign page 2 in ink.
  1. Keep a copy for your records.
  % if (working or working_for_self) and any(job.have_pay_stubs for job in jobs):
  1. Include copies of the pay stubs you reported having.
  % endif
  1. Send the statement and any supporting documents to the Social Security office you selected: **${ ssa_office.address.on_one_line(show_country=False) }**.
  1. Contact Social Security at 1-800-772-1213 if you need help sending your statement.
attachment:
  name: Statement to Social Security
  filename: Social_Security_statement
  manual:
    pdf: ssa_statement.as_pdf()
---
objects:
  - ssa_statement: ALDocument.using(title="Statement to Social Security", filename="Social_Security_statement", enabled=True, has_addendum=True, default_overflow_message=" [Continued on attached page]")
---
code: |
  ssa_statement.overflow_fields['statement_text'].overflow_trigger = 1600
  ssa_statement.overflow_fields['statement_text'].label = "Statement continued"
  ssa_statement.overflow_fields.gathered = True
---
code: |
  # Normalize spacing before measuring the PDF field so that repeated line breaks
  # cannot exhaust the available page height independently of the character limit.
  statement_text = " ".join(str(summary_of_changes).split())
---
attachment:
  variable name: ssa_statement.addendum
  docx template file: ssa_statement_continuation.docx
---
id: final attachment
attachment:
  name: ${client}'s Letter to SSA
  variable name: ssa_statement[i]
  filename: ${space_to_underscore(format_date(today()) + client.possessive('letter to SSA'))}
  pdf template file: report_changes_to_ssa.pdf
  fields:
    - "user_name": ${client}
    - "user_representative": ""
    - "user_representative_relationship": ""
    - "summary_of_changes": ${ssa_statement.safe_value('statement_text')}
    - "letter_date": ${letter_date}
    - "user_signature": ${client.signature if i == 'final' else ''}
    - "client_phone_number": ${client.phone_number}
    - "client_address_block": ${client.address.line_one()}
    - "client_address_city_state": ${client.address.city} ${client.address.state}
    - "client_address_zip": ${client.address.zip}
---
template: summary_of_changes
content: | 
  % for job in employer_jobs:
  On ${job.start_date}, I started working for ${job.employer}${' at ' + str(job.employer_address) if job.employer_address else ''}. I work about ${round(job.normalized_hours(12))} hours per month and earn ${currency(job.hourly_rate) + ' per hour' if job.is_hourly else currency(job.amount(period_to_use=12)) + ' per month'}.
  % endfor

  % for job in self_jobs:
  On ${job.start_date}, I started working for myself doing ${job.self_employment_type}. I work approximately ${round(job.normalized_hours(12))} hours every month. My business earns about ${currency(job.amount(period_to_use=12))} every month. It costs me ${currency(job.deductions)} monthly in expenses to run my business.
  % endfor
  
  % if benefits_type == 'ssi' and changes.true_values().number() > 0:
  I ${'also' if working or working_for_self else ''} need to report to Social Security that:
  % for change in changes.true_values():
  % if change == "I moved":
  • I moved on ${change_details[change].date}. My new address is ${client.address.on_one_line()}
  % elif change == 'I was outside of the United States for more than 30 days in a row':
  • I was outside the United States from ${expat_start} to ${expat_end}.
  % elif change == 'I received an arrest warrant':
  • I received an arrest warrant on ${change_details[change].date}.
  % elif change == "The number of people in my household changed":
  • My household changed on ${change_details[change].date}. ${change_details['The number of people in my household changed'].reasons.true_values()}.
  % else:
  • ${change} on ${change_details[change].date}.
  % endif
  % endfor
  % endif
  
  ${showifdef('other_changes')}
  
  ${showifdef('changes_details')}
---
code: |
  ssa_office.name.text = ""
