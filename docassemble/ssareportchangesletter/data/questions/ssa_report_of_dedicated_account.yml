metadata:
  title: Report of benefits and Dedicated Account
  short title: Dedicated account worksheet
  description: |
    Prepare answers for the Representative Payee Report of Benefits and Dedicated Account that Social Security mailed you.
  can_I_use_this_form: |
    Use this worksheet if SSA asked for a full SSA-6233 report or told you to complete only questions 6 through 8.
  before_you_start: |
    Gather the report SSA mailed you, account statements for the report period, and records of deposits and purchases.
  maturity: testing
  estimated_completion_minutes: 30
  languages:
    - en
  jurisdiction: NAM-US
  help_page_url: https://www.ssa.gov/payee/
  help_page_title: Help for representative payees
  form_titles:
    - Report of Benefits and Dedicated Account
  original_form: https://www.ssa.gov/payee/NewGuide/ssa-6233exhibitsA.pdf
  form_numbers:
    - SSA-6233-BK
  LIST_topics:
    - BE-01-03-00-00
  tags:
    - BE-01-03-00-00
---
include:
  - vlp_branding.yml
---
modules:
  - docassemble.income.income
---
objects:
  - client: Individual
  - rep_payee: Individual
  - dedicated_account: Ledger
  - dedicated_account_deposits: Ledger
---
initial: True
code: |
  set_info(user=rep_payee)
---
features:
  navigation: True
  progress bar: True
  question back button: True
  navigation back button: False
---
sections:
  - intro: Instructions
  - people: Beneficiary and payee
  - regular: Regular benefits
  - dedicated: Dedicated account
  - receipts: Receipts
  - download: Download
---
id: order
mandatory: True
code: |
  if annual_scope == "unsure":
    full_report_help
  accepted_worksheet_terms
  client.name.first
  rep_payee.name.first
  date_to
  if annual_scope == "full":
    full_events_reviewed
    full_spending_reviewed
    if regular_saved > 0:
      full_savings_reviewed
  dedicated_account_deposits.gather()
  dedicated_account.gather()
  review_account
  if dedicated_account.number():
    gather_receipts
    if not used_for_valid_purpose:
      how_spending_benefited_client
  reported_ending_balance
  store_variables_snapshot(data={'date': today(), 'report_scope': annual_scope})
  pdf_report
---
id: worksheet scope
section: intro
question: |
  Which parts of Form SSA-6233 did Social Security ask you to complete?
subquestion: |
  This worksheet helps you report activity in a dedicated account. Have the report SSA mailed you and your account statements ready.
fields:
  - Your instructions from SSA: annual_scope
    input type: radio
    choices:
      - My Social Security office told me to complete only questions 6 through 8: "yes"
      - SSA wants the full report: full
      - I am not sure: unsure
---
id: full report help
section: intro
event: full_report_help
question: |
  Check the instructions on your SSA report
subquestion: |
  Contact the office listed on your notice and ask which questions to complete. Return here when you know which parts you need.

  If you need another copy or help reaching your office, call Social Security at 1-800-772-1213. Follow the deadline in your notice.
---
id: worksheet terms
section: intro
question: |
  Before you start
subquestion: |
  This tool helps you prepare a worksheet. You will still need to complete, sign, and return the form SSA sent. Review the [terms of use](https://vlpnet.org/tos-for-guided-interviews/) before continuing.
fields:
  - Terms of use: accepted_worksheet_terms
    datatype: checkboxes
    minlength: 1
    choices:
      - I accept the terms of use: accepted
---
id: rep payee name
section: people
question: |
  What is your name?
fields:
  - First name: rep_payee.name.first
  - Middle name: rep_payee.name.middle
    required: False
  - Last name: rep_payee.name.last
---
id: recipient name
section: people
question: |
  Who is getting the Social Security Benefits?
subquestion: |
  List the name of the person who you are the rep payee
  for.
fields:
  - First name: client.name.first
  - Middle name: client.name.middle
    required: False
  - Last name: client.name.last
---
id: time period
section: people
question: |
  What time does this report cover?
subquestion: |
  Look at the letter you got from Social Security to find the period of the report.
  If you don't have the letter, call Social Security at 1-800-772-1213.
fields:
  - Report begins: date_from
    datatype: date
  - Report ends: date_to
    datatype: date
validation code: |
  if date_to < date_from:
    validation_error("Enter an end date on or after the start date.", field="date_to")
---
id: full report events
section: regular
question: |
  What happened during the report period?
fields:
  - Were you convicted of a felony during this period?: report_felony
    datatype: yesnoradio
  - What type of crime was it?: report_felony_details
    show if: report_felony
  - Did the beneficiary keep living alone, with the same person, or in the same institution?: same_living_arrangement
    datatype: yesnoradio
  - Describe the change and give the beneficiary's current address: living_change_details
    hide if: same_living_arrangement
continue button field: full_events_reviewed
---
id: regular benefits
section: regular
question: |
  How did you use ${client.possessive('regular benefits')}?
subquestion: |
  Use the total accountable benefit amount in question 3 of the SSA form. Leave out money in the dedicated account.
fields:
  - Total accountable benefit amount printed in question 3: regular_accountable
    datatype: currency
    min: 0
  - Did you decide how the benefits were spent or saved?: regular_payee_decided
    datatype: yesnoradio
  - Who decided and how?: regular_decider
    hide if: regular_payee_decided
  - Amount spent on food and housing: regular_food
    datatype: currency
    min: 0
  - Amount spent on other items: regular_other
    datatype: currency
    min: 0
  - Amount saved at the end of the report period: regular_saved
    datatype: currency
    min: 0
  - Did the beneficiary live in a care facility and receive less than $360 in spending for personal needs during the year?: explain_personal_needs
    datatype: yesnoradio
  - Explain how the beneficiary's personal needs were met: regular_personal_needs
    show if: explain_personal_needs
validation code: |
  accounted_for = sum(Decimal(str(value)) for value in (regular_food, regular_other, regular_saved))
  if accounted_for != Decimal(str(regular_accountable)):
    validation_error("Food and housing, other spending, and savings must add up to the total in question 3. Check these amounts against your records.")
continue button field: full_spending_reviewed
---
id: savings
section: regular
question: |
  How were the regular benefits saved?
fields:
  - Select every type of account used: regular_accounts
    datatype: checkboxes
    none of the above: False
    minlength: 1
    choices:
      - Savings or checking account: savings
      - U.S. savings bonds: bonds
      - Certificates of deposit: certificates
      - Collective savings or checking account: collective
      - Other: other
  - Describe the other account or investment: regular_other_account
    show if: regular_accounts['other']
  - Select every way the accounts were titled: regular_titles
    datatype: checkboxes
    none of the above: False
    minlength: 1
    choices:
      - Beneficiary's name by your name: beneficiary
      - Your name for beneficiary's name: payee
      - Other: other
  - Give the other account title: regular_other_title
    show if: regular_titles['other']
continue button field: full_savings_reviewed
---
id: account activity
section: dedicated
question: |
  What happened in the dedicated account?
subquestion: |
  Use the period from ${date_from} through ${date_to}. Box 6 on the form from SSA already includes past-due benefits SSA deposited.
fields:
  - Total dedicated account amount printed in box 6: report_dedicated_account_total_balance
    datatype: currency
    min: 0
  - Did you make any deposits during this period, apart from the SSA deposits already included in box 6?: dedicated_account_deposits.there_are_any
    datatype: yesnoradio
  - Did you take any money out during this period?: dedicated_account.there_are_any
    datatype: yesnoradio
---
id: deposits
section: dedicated
question: |
  List each deposit you made
  during the report period
subquestion: |
  Leave out the SSA deposits already counted in box 6.
list collect: True
fields:
  - Date of deposit: dedicated_account_deposits[i].date
    datatype: date
    min: ${date_from}
    max: ${date_to}
  - Amount: dedicated_account_deposits[i].value
    datatype: currency
    min: 0.01
  - Description: dedicated_account_deposits[i].description
---
id: withdrawals
section: dedicated
question: |
  List each **purchase** you made using money from the dedicated
  account during the report period
subquestion: |
  You must explain how each purchase relates to the child's disability or
  education.

  Click to learn more about the [rules for what relates to a child's disability or education](https://secure.ssa.gov/apps10/poms.nsf/lnx/0200602140).

list collect: True
fields:
  - Date of purchase: dedicated_account[i].date
    datatype: date
    min: ${date_from}
    max: ${date_to}
  - Amount: dedicated_account[i].value
    datatype: currency
    min: 0.01
  - What did you buy?: dedicated_account[i].description
    datatype: area
    rows: 2
  - Did Social Security pre-approve this purchase?: dedicated_account[i].preapproved
    datatype: yesnoradio
  - When and how?: dedicated_account[i].preapproval_date_how
    datatype: area
    rows: 2
    show if: dedicated_account[i].preapproved
  - What was it used for?: dedicated_account[i].purpose
    datatype: checkboxes
    choices:
      - Medical treatment: medical treatment
      - Education: education
      - Job skills: job skills training
      - Something else: other
    minlength: 1
    none of the above: false
  - note: |
      **You need to explain this purchase to Social Security**.
      You will have a chance to explain this at the end of this interview.
    show if: dedicated_account[i].purpose['other']
  - label: |
      Explain why you bought the item and how it's related to your child's disability or education.
    label above field: True
    field: dedicated_account[i].detailed_purpose
    datatype: area
    rows: 2
---
reconsider: True
code: |
  used_for_valid_purpose = all(not entry.purpose['other'] for entry in dedicated_account)
---
id: benefit
section: dedicated
question: |
  How did the money benefit ${client}?
subquestion: |
  You said that some of the money you spent was _not_ spent
  for either medical expenses, education, or training.
fields:
  - How did your spending benefit ${client} and how were they related to ${client}'s disability?: how_spending_benefited_client
    maxlength: 405
    datatype: area
---
id: receipts
section: receipts
continue button field: identify_receipts
question: |
  Do you have any receipts?
subquestion: |
  Look at the list of purchases below. Check the box if you have a receipt you'd
  like to keep with your personal worksheet. Keep the original receipts.
fields:
  - no label: receipt_list
    required: False
    datatype: object_checkboxes
    choices: dedicated_account
    object labeler: |
      lambda y: currency(y.amount()) + ', ' + y.date + ' (' + y.description + ')'
---
code: |
  for rec in receipt_list:
    rec.receipt
  gather_receipts = True
---
id: receipt
section: receipts
question: |
  Purchase of ${currency(dedicated_account[i].amount())} on ${dedicated_account[i].date}
subquestion: |
  You said you have a receipt for this purchase. Please upload a photo of the receipt.
  If you are using your phone, you can use the camera in your phone to take the photo.
fields:
  - Upload a receipt: dedicated_account[i].receipt
    datatype: camera
    maximum image size: 1800
---
table: dedicated_account.table
rows: dedicated_account
columns:
  - Date: |
      row_item.date
  - Amount: |
      currency(row_item.amount())
  - Description: |
      row_item.description
edit:
  - value
---
table: dedicated_account_deposits.table
rows: dedicated_account_deposits
columns:
  - Date: |
      row_item.date
  - Amount: |
      currency(row_item.amount())
  - Description: |
      row_item.description
edit:
  - value
---
reconsider: True
code: |
  dedicated_account.calculate()
  dedicated_account_deposits.calculate()
  calculated_ledger = True
---
need: calculated_ledger
id: review account
section: dedicated
field: review_account
question: |
  Review your dedicated account entries
subquestion: |
  So far, it looks like you deposited ${currency(dedicated_account_deposits.total())}
  since your last report to SSA and withdrew ${currency(dedicated_account.total())},
  which means the balance before interest or other adjustments is **${currency(Decimal(str(report_dedicated_account_total_balance)) + Decimal(dedicated_account_deposits.total()) - Decimal(dedicated_account.total()) )}**

  If that doesn't look right, make any changes needed below.

  ### Deposits
  ${dedicated_account_deposits.table}
  ${dedicated_account_deposits.add_action()}

  ### Withdrawals
  ${dedicated_account.table}
  ${dedicated_account.add_action()}


---
id: statement balance
section: dedicated
question: |
  What was the actual balance at the end of the report period?
subquestion: |
  Use your bank records for ${date_to}. Include interest earned through that date. Enter zero if the account was empty.
fields:
  - Ending balance for question 8: reported_ending_balance
    datatype: currency
    min: 0
---
id: download
section: download
event: pdf_report
question: |
  Your dedicated account worksheet is ready
subquestion: |
  Copy your answers to ${"questions 6 through 8" if annual_scope == "yes" else "the full report"} on the form SSA mailed you. Use whole dollars on that form.
  Sign and date the SSA form. Return it in the envelope SSA provided by the deadline in your notice.
  Keep your worksheet, bank records, and receipts for two years. Send supporting records only if SSA asks for them.

  [Download your worksheet (PDF)](${ssa_6233_appendix.pdf.url_for()})

  [Download an editable copy (Word)](${ssa_6233_appendix.docx.url_for()})
---
attachment:
  variable name: ssa_6233_appendix
  name: Dedicated account worksheet
  filename: dedicated_account_worksheet
  docx template file: dedicated_account_appendix.docx
  valid formats:
    - pdf
    - docx
